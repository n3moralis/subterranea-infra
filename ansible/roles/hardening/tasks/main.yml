---
# Security layer for every block. Order is anti-lockout: everything that could
# cut access (sudo, SSH, firewall) comes last and each step proves access.
- name: Preflight
  ansible.builtin.import_tasks: preflight.yml

- name: Mandatory access control (SELinux / AppArmor)
  ansible.builtin.include_tasks: "mac_{{ ansible_facts['os_family'] }}.yml"

- name: Kernel parameters
  ansible.builtin.import_tasks: sysctl.yml

- name: Audit trail
  ansible.builtin.import_tasks: audit.yml

- name: Sudo with password
  ansible.builtin.import_tasks: sudo.yml

- name: SSH keys only
  ansible.builtin.import_tasks: ssh.yml

- name: Host firewall
  ansible.builtin.import_tasks: firewall.yml
