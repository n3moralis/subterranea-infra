---
- name: Audit rules for security-relevant files
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/90-hardening.rules
    content: |
      ## Managed by Ansible (role hardening) — who changed access control?
      -w /etc/sudoers -p wa -k sudoers
      -w /etc/sudoers.d/ -p wa -k sudoers
      -w /etc/ssh/sshd_config -p wa -k sshd
      -w /etc/ssh/sshd_config.d/ -p wa -k sshd
      -w /etc/passwd -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/group -p wa -k identity
      -w /etc/gshadow -p wa -k identity
      -w /etc/subuid -p wa -k identity
      -w /etc/subgid -p wa -k identity
      -w /etc/firewalld/ -p wa -k firewall
      -w /etc/sysctl.d/ -p wa -k sysctl
    owner: root
    group: root
    mode: "0600"
  notify: Load audit rules
