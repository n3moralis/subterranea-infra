---
# Runner major.minor = GitLab major.minor. Required.
# gitlab_runner_version: "18.4.0"
gitlab_runner_user: gitlab-runner
gitlab_runner_concurrent: 2
gitlab_runner_repo_base: https://packages.gitlab.com/runner/gitlab-runner
# Two different keys (GitLab docs "Install GitLab Runner using the official
# repositories"): the first signs the repository METADATA (shared by all
# packages.gitlab.com projects), the second signs the runner PACKAGES. dnf needs
# both: repo_gpgcheck uses the first, gpgcheck the second. Verify the imported
# package key's fingerprint against the docs ("Current GPG public key").
gitlab_runner_gpgkeys:
  - "{{ gitlab_runner_repo_base }}/gpgkey"
  - "{{ gitlab_runner_repo_base }}/gpgkey/runner-gitlab-runner-49F16C5CC3A0F81F.pub.gpg"
