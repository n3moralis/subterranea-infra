---
# Operating baseline for every block: packages, time, updates, guest agent.
# Security lives in role "hardening" (separate building block).
- name: Preflight
  ansible.builtin.import_tasks: preflight.yml

- name: Packages and services
  ansible.builtin.import_tasks: packages.yml

- name: Time
  ansible.builtin.import_tasks: time.yml

- name: Automatic security updates
  ansible.builtin.include_tasks: "updates_{{ ansible_facts['os_family'] }}.yml"
  when: base_auto_security_updates | bool
