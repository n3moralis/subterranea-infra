[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = false
timeout = 30
# Host keys were accepted once with ssh-copy-id. Keep verification ON:
# a changed host key on a secrets node must stop the run, not be ignored.
host_key_checking = true
# Never write task output (which may contain secrets) to a log file.
# log_path is intentionally unset.

[privilege_escalation]
become_method = sudo

[ssh_connection]
# Pipelining sends modules over the SSH channel instead of temp files on the
# target, so module arguments (secret_id, webhook) never touch the remote disk.
pipelining = true
